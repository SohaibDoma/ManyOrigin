<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManyOrigin</title>

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon.svg"
          media="(prefers-color-scheme: light)">

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon-dark.svg"
          media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ========================================
         FIXED PAGE CONTROL
    ======================================== -->

    <div class="page-control">

        <!-- Question Mark -->

        <a href="#parent-company"
           class="info-button"
           id="info-button"
           aria-label="Enter">

            ?

        </a>


        <!-- X -->

        <a href="#hero"
           class="close-button"
           id="close-button"
           aria-label="Close">

            <span></span>
            <span></span>

        </a>

    </div>


    <!-- ========================================
         SCREEN 1
    ======================================== -->

    <section class="hero" id="hero">

        <div class="logo-container">

            <a href="#parent-company"
               aria-label="Enter ManyOrigin"
               id="enter-manyorigin">

                <img src="./assets/manyorigin-icon.svg"
                     alt="ManyOrigin">

            </a>

        </div>

    </section>


    <!-- ========================================
         SCREEN 2
    ======================================== -->

    <section class="parent-company" id="parent-company">

        <div class="parent-content">

            <h2>
                ManyOrigin is the<br>
                Parent Company<br>
                of
            </h2>


            <div class="child-company">

                <a href="https://wadisite.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/wadisite-logo.svg"
                         alt="WadiSite"
                         class="company-logo">

                </a>

            </div>


            <div class="child-company">

                <a href="https://factlark.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/factlark-logo.svg"
                         alt="FactLark"
                         class="company-logo">

                </a>

            </div>

        </div>

    </section>


<script>

    const manyOriginLogo =
        document.querySelector(".logo-container img");

    const infoButton =
        document.getElementById("info-button");

    const closeButton =
        document.getElementById("close-button");


    let pageTwoActive = false;

    let touchStartY = 0;
    let touchStartX = 0;
    let touchTriggered = false;

    let scrollAnimation = null;


    // ========================================
    // INTERRUPTIBLE PAGE SCROLL
    // ========================================

    function moveToPage(target) {

        if (scrollAnimation) {
            cancelAnimationFrame(scrollAnimation);
            scrollAnimation = null;
        }


        const start = window.scrollY;
        const distance = target - start;

        const duration = 550;
        const startTime = performance.now();


        function animate(currentTime) {

            const elapsed =
                currentTime - startTime;

            const progress =
                Math.min(elapsed / duration, 1);


            // Smooth ease-in-out

            const eased =
                progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(
                        -2 * progress + 2,
                        2
                    ) / 2;


            window.scrollTo(
                0,
                start + distance * eased
            );


            if (progress < 1) {

                scrollAnimation =
                    requestAnimationFrame(
                        animate
                    );

            } else {

                scrollAnimation = null;

            }

        }


        scrollAnimation =
            requestAnimationFrame(animate);

    }


    // ========================================
    // ENTER PAGE 2
    // ========================================

    function enterPageTwo(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }


        if (pageTwoActive) return;


        pageTwoActive = true;


        // ? disappears

        infoButton.classList.add("hide");


        // ManyOrigin logo disappears

        manyOriginLogo.classList.add("hide");


        // X appears

        closeButton.classList.add("show");


        // Move to Page 2

        moveToPage(window.innerHeight);

    }


    // ========================================
    // RETURN TO PAGE 1
    // ========================================

    function returnToPageOne(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }


        if (!pageTwoActive) return;


        pageTwoActive = false;


        // X disappears

        closeButton.classList.remove("show");


        // ? appears

        infoButton.classList.remove("hide");


        // ManyOrigin logo appears

        manyOriginLogo.classList.remove("hide");


        // Move to Page 1

        moveToPage(0);

    }


    // ========================================
    // MANYORIGIN LOGO
    // ========================================

    document
        .getElementById("enter-manyorigin")
        .addEventListener(
            "click",
            enterPageTwo
        );


    // ========================================
    // ? BUTTON
    // ========================================

    infoButton.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // X BUTTON
    // ========================================

    closeButton.addEventListener(
        "click",
        returnToPageOne
    );


    // ========================================
    // SAFARI — IMMEDIATE BUTTON TOUCH
    // ========================================

    infoButton.addEventListener(
        "touchend",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            enterPageTwo();

        },
        { passive: false }
    );


    closeButton.addEventListener(
        "touchend",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            returnToPageOne();

        },
        { passive: false }
    );


    // ========================================
    // DESKTOP WHEEL
    // ========================================

    window.addEventListener(
        "wheel",
        function (event) {

            event.preventDefault();


            if (
                event.deltaY > 0 &&
                !pageTwoActive
            ) {

                enterPageTwo();

                return;
            }


            if (
                event.deltaY < 0 &&
                pageTwoActive
            ) {

                returnToPageOne();

                return;
            }

        },
        { passive: false }
    );


    // ========================================
    // MOBILE TOUCH START
    // ========================================

    window.addEventListener(
        "touchstart",
        function (event) {

            touchStartY =
                event.touches[0].clientY;

            touchStartX =
                event.touches[0].clientX;

            touchTriggered = false;

        },
        { passive: true }
    );


    // ========================================
    // MOBILE TOUCH MOVE
    // ========================================

    window.addEventListener(
        "touchmove",
        function (event) {

            const currentY =
                event.touches[0].clientY;

            const currentX =
                event.touches[0].clientX;


            const deltaY =
                touchStartY - currentY;

            const deltaX =
                touchStartX - currentX;


            // Ignore horizontal movement

            if (
                Math.abs(deltaX) >
                Math.abs(deltaY)
            ) {

                return;

            }


            event.preventDefault();


            if (touchTriggered) return;


            const swipeDistance = 35;


            // ====================================
            // SWIPE UP
            // ====================================

            if (
                deltaY > swipeDistance &&
                !pageTwoActive
            ) {

                touchTriggered = true;

                enterPageTwo();

                return;
            }


            // ====================================
            // SWIPE DOWN
            // ====================================

            if (
                deltaY < -swipeDistance &&
                pageTwoActive
            ) {

                touchTriggered = true;

                returnToPageOne();

                return;
            }

        },
        { passive: false }
    );


    // ========================================
    // MOBILE TOUCH END
    // ========================================

    window.addEventListener(
        "touchend",
        function () {

            touchTriggered = false;

        },
        { passive: true }
    );

</script>

</body>
</html>

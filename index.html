<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManyOrigin</title>

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon.svg"
          media="(prefers-color-scheme: light)">

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon-dark.svg"
          media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ========================================
         FIXED PAGE CONTROL
    ======================================== -->

    <div class="page-control">

        <!-- Question Mark -->

        <a href="#parent-company"
           class="info-button"
           id="info-button"
           aria-label="Enter">

            ?

        </a>


        <!-- X -->

        <a href="#hero"
           class="close-button"
           id="close-button"
           aria-label="Close">

            <span></span>
            <span></span>

        </a>

    </div>


    <!-- ========================================
         SCREEN 1
    ======================================== -->

    <section class="hero" id="hero">

        <div class="logo-container">

            <a href="#parent-company"
               aria-label="Enter ManyOrigin"
               id="enter-manyorigin">

                <img src="./assets/manyorigin-icon.svg"
                     alt="ManyOrigin">

            </a>

        </div>

    </section>


    <!-- ========================================
         SCREEN 2
    ======================================== -->

    <section class="parent-company" id="parent-company">

        <div class="parent-content">

            <h2>
                ManyOrigin is the<br>
                Parent Company<br>
                of
            </h2>


            <div class="child-company">

                <a href="https://wadisite.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/wadisite-logo.svg"
                         alt="WadiSite"
                         class="company-logo">

                </a>

            </div>


            <div class="child-company">

                <a href="https://factlark.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/factlark-logo.svg"
                         alt="FactLark"
                         class="company-logo">

                </a>

            </div>

        </div>

    </section>


<script>

    const manyOriginLogo =
        document.querySelector(".logo-container img");

    const enterManyOrigin =
        document.getElementById("enter-manyorigin");

    const infoButton =
        document.getElementById("info-button");

    const closeButton =
        document.getElementById("close-button");


    let pageTwoActive = false;
    let transitioning = false;


    // ========================================
    // INITIAL STATE
    // ========================================

    document.body.style.overflow = "hidden";


    // ========================================
    // ENTER PAGE 2
    // ========================================

    function enterPageTwo(event) {

        event.preventDefault();
        event.stopPropagation();

        if (transitioning || pageTwoActive) return;


        transitioning = true;
        pageTwoActive = true;


        // ManyOrigin logo disappears

        manyOriginLogo.classList.add("hide");


        // ? disappears

        infoButton.classList.add("hide");


        // X appears

        closeButton.classList.add("show");


        // Unlock scrolling

        document.body.style.overflow = "auto";


        // Scroll to Page 2

        setTimeout(() => {

            window.scrollTo({
                top: window.innerHeight,
                behavior: "smooth"
            });

        }, 300);


        // Allow interaction again

        setTimeout(() => {

            transitioning = false;

        }, 750);

    }


    // ========================================
    // MANYORIGIN LOGO
    // ========================================

    enterManyOrigin.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // QUESTION MARK
    // EXACTLY THE SAME ACTION AS LOGO
    // ========================================

    infoButton.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // RETURN TO PAGE 1
    // ========================================

    function returnToPageOne(event) {

        event.preventDefault();
        event.stopPropagation();

        if (transitioning || !pageTwoActive) return;


        transitioning = true;
        pageTwoActive = false;


        // X disappears

        closeButton.classList.remove("show");


        // ? appears

        infoButton.classList.remove("hide");


        // ManyOrigin logo appears

        manyOriginLogo.classList.remove("hide");


        // Scroll back to Page 1

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        // Lock Page 1 after transition

        setTimeout(() => {

            document.body.style.overflow = "hidden";
            transitioning = false;

        }, 700);

    }


    // ========================================
    // X BUTTON
    // ========================================

    closeButton.addEventListener(
        "click",
        returnToPageOne
    );


    // ========================================
    // SCROLL CONTROL
    // ========================================

    window.addEventListener(
        "wheel",
        function (event) {


            // ====================================
            // PAGE 1
            // ====================================

            if (
                !pageTwoActive &&
                event.deltaY > 0
            ) {

                event.preventDefault();

                return;

            }


            // ====================================
            // PAGE 2
            // ====================================

            if (
                pageTwoActive &&
                event.deltaY < 0 &&
                !transitioning
            ) {

                event.preventDefault();

                returnToPageOne(event);

            }

        },
        { passive: false }
    );

</script>

</body>
</html>

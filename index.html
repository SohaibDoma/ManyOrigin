<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManyOrigin</title>

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon.svg"
          media="(prefers-color-scheme: light)">

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon-dark.svg"
          media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ========================================
         FIXED PAGE CONTROL
    ======================================== -->

    <div class="page-control">

        <!-- Question Mark -->

        <a href="#parent-company"
           class="info-button"
           id="info-button"
           aria-label="Enter">

            ?

        </a>


        <!-- X -->

        <a href="#hero"
           class="close-button"
           id="close-button"
           aria-label="Close">

            <span></span>
            <span></span>

        </a>

    </div>


    <!-- ========================================
         SCREEN 1
    ======================================== -->

    <section class="hero" id="hero">

        <div class="logo-container">

            <a href="#parent-company"
               aria-label="Enter ManyOrigin"
               id="enter-manyorigin">

                <img src="./assets/manyorigin-icon.svg"
                     alt="ManyOrigin">

            </a>

        </div>

    </section>


    <!-- ========================================
         SCREEN 2
    ======================================== -->

    <section class="parent-company" id="parent-company">

        <div class="parent-content">

            <h2>
                ManyOrigin is the<br>
                Parent Company<br>
                of
            </h2>


            <div class="child-company">

                <a href="https://wadisite.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/wadisite-logo.svg"
                         alt="WadiSite"
                         class="company-logo">

                </a>

            </div>


            <div class="child-company">

                <a href="https://factlark.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/factlark-logo.svg"
                         alt="FactLark"
                         class="company-logo">

                </a>

            </div>

        </div>

    </section>


<script>

    const manyOriginLogo =
        document.querySelector(".logo-container img");

    const infoButton =
        document.getElementById("info-button");

    const closeButton =
        document.getElementById("close-button");


    let pageTwoActive = false;
    let transitioning = false;


    // ========================================
    // ENTER PAGE 2
    // ========================================

    function enterPageTwo(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        if (transitioning || pageTwoActive) return;

        transitioning = true;
        pageTwoActive = true;


        // ? disappears

        infoButton.classList.add("hide");


        // ManyOrigin logo disappears

        manyOriginLogo.classList.add("hide");


        // X appears

        closeButton.classList.add("show");


        // EXACTLY ONE FULL PAGE

        window.scrollTo({
            top: window.innerHeight,
            behavior: "smooth"
        });


        setTimeout(() => {

            transitioning = false;

        }, 700);
    }


    // ========================================
    // RETURN TO PAGE 1
    // ========================================

    function returnToPageOne(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        if (transitioning || !pageTwoActive) return;

        transitioning = true;
        pageTwoActive = false;


        // X disappears

        closeButton.classList.remove("show");


        // ? appears

        infoButton.classList.remove("hide");


        // ManyOrigin logo appears

        manyOriginLogo.classList.remove("hide");


        // EXACTLY ONE FULL PAGE BACK

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        setTimeout(() => {

            transitioning = false;

        }, 700);
    }


    // ========================================
    // MANYORIGIN LOGO CLICK
    // ========================================

    document
        .getElementById("enter-manyorigin")
        .addEventListener(
            "click",
            enterPageTwo
        );


    // ========================================
    // ? CLICK
    // ========================================

    infoButton.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // X CLICK
    // ========================================

    closeButton.addEventListener(
        "click",
        returnToPageOne
    );


    // ========================================
    // FULL-PAGE SCROLL CONTROL
    // ========================================

    window.addEventListener(
        "wheel",
        function (event) {

            if (transitioning) {
                event.preventDefault();
                return;
            }


            // ====================================
            // PAGE 1 → PAGE 2
            // ====================================

            if (
                !pageTwoActive &&
                event.deltaY > 0
            ) {

                event.preventDefault();

                enterPageTwo();

                return;
            }


            // ====================================
            // PAGE 2 → PAGE 1
            // ====================================

            if (
                pageTwoActive &&
                event.deltaY < 0
            ) {

                event.preventDefault();

                returnToPageOne();

                return;
            }


            // ====================================
            // BLOCK ALL OTHER SCROLLING
            // ====================================

            event.preventDefault();

        },
        { passive: false }
    );


    // ========================================
    // KEEP EXACTLY AT PAGE POSITIONS
    // ========================================

    window.addEventListener(
        "scroll",
        function () {

            if (transitioning) return;


            const pageHeight = window.innerHeight;


            if (!pageTwoActive && window.scrollY !== 0) {

                window.scrollTo({
                    top: 0,
                    behavior: "auto"
                });

            }


            if (pageTwoActive && window.scrollY !== pageHeight) {

                window.scrollTo({
                    top: pageHeight,
                    behavior: "auto"
                });

            }

        }
    );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManyOrigin</title>

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon.svg"
          media="(prefers-color-scheme: light)">

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon-dark.svg"
          media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ========================================
         SCREEN 1
    ======================================== -->

    <section class="hero" id="hero">

        <!-- Question Mark -->

        <a href="#parent-company"
           class="info-button"
           id="info-button">
            ?
        </a>


        <!-- ManyOrigin Logo -->

        <div class="logo-container">

            <a href="#parent-company"
               aria-label="Enter ManyOrigin"
               id="enter-manyorigin">

                <img src="./assets/manyorigin-icon.svg"
                     alt="ManyOrigin">

            </a>

        </div>

    </section>


    <!-- ========================================
         SCREEN 2
    ======================================== -->

    <section class="parent-company" id="parent-company">

        <!-- X belongs to Page 2 -->

        <a href="#hero"
           class="close-button"
           id="close-button"
           aria-label="Close">

            <span></span>
            <span></span>

        </a>


        <div class="parent-content">

            <h2>
                ManyOrigin is the<br>
                Parent Company<br>
                of
            </h2>


            <div class="child-company">

                <a href="https://wadisite.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/wadisite-logo.svg"
                         alt="WadiSite"
                         class="company-logo">

                </a>

            </div>


            <div class="child-company">

                <a href="https://factlark.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/factlark-logo.svg"
                         alt="FactLark"
                         class="company-logo">

                </a>

            </div>

        </div>

    </section>


<script>

    const hero =
        document.querySelector(".hero");

    const manyOriginLogo =
        document.querySelector(".logo-container img");

    const infoButton =
        document.getElementById("info-button");

    const closeButton =
        document.getElementById("close-button");


    let pageTwoActive = false;
    let transitioning = false;


    // ========================================
    // INITIAL STATE
    // ========================================

    document.body.style.overflow = "hidden";


    // ========================================
    // ENTER PAGE 2
    // ========================================

    function enterPageTwo(event) {

        event.preventDefault();
        event.stopPropagation();

        if (transitioning || pageTwoActive) return;


        transitioning = true;
        pageTwoActive = true;


        // Page 1 elements disappear together

        manyOriginLogo.classList.add("hide");
        infoButton.classList.add("hide");


        // Page 2 X appears

        closeButton.classList.add("show");


        // Unlock scrolling

        document.body.style.overflow = "auto";


        // Scroll to Page 2

        setTimeout(() => {

            window.scrollTo({
                top: window.innerHeight,
                behavior: "smooth"
            });

            transitioning = false;

        }, 300);

    }


    // ========================================
    // MANYORIGIN LOGO
    // ========================================

    document
        .getElementById("enter-manyorigin")
        .addEventListener("click", enterPageTwo);


    // ========================================
    // QUESTION MARK
    // Behaves exactly like the logo
    // ========================================

    infoButton.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // X BUTTON
    // Behaves exactly like scrolling up
    // ========================================

    closeButton.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            if (
                transitioning ||
                !pageTwoActive
            ) return;


            transitioning = true;
            pageTwoActive = false;


            // Return to Page 1

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            // Wait for Page 1 to settle

            setTimeout(() => {

                // X disappears

                closeButton.classList.remove(
                    "show"
                );


                // Page 1 elements return

                manyOriginLogo.classList.remove(
                    "hide"
                );

                infoButton.classList.remove(
                    "hide"
                );

            }, 450);


            // Lock Page 1 again

            setTimeout(() => {

                document.body.style.overflow =
                    "hidden";

                transitioning = false;

            }, 700);

        }
    );


    // ========================================
    // SCROLL CONTROL
    // ========================================

    window.addEventListener(
        "wheel",
        function (event) {


            // ====================================
            // PAGE 1
            // Block normal downward scrolling
            // ====================================

            if (
                !pageTwoActive &&
                event.deltaY > 0
            ) {

                event.preventDefault();
                return;

            }


            // ====================================
            // PAGE 2
            // One upward scroll returns to Page 1
            // ====================================

            if (
                pageTwoActive &&
                event.deltaY < 0 &&
                !transitioning
            ) {

                event.preventDefault();


                transitioning = true;
                pageTwoActive = false;


                // Return to Page 1

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });


                // Wait for Page 1 to settle

                setTimeout(() => {

                    // X disappears

                    closeButton.classList.remove(
                        "show"
                    );


                    // Page 1 elements return

                    manyOriginLogo.classList.remove(
                        "hide"
                    );

                    infoButton.classList.remove(
                        "hide"
                    );

                }, 450);


                // Lock Page 1

                setTimeout(() => {

                    document.body.style.overflow =
                        "hidden";

                    transitioning = false;

                }, 700);

            }

        },
        { passive: false }
    );

</script>

</body>
</html>

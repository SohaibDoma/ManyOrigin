<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ManyOrigin</title>

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon.svg"
          media="(prefers-color-scheme: light)">

    <link rel="icon"
          type="image/svg+xml"
          href="./assets/manyorigin-icon-dark.svg"
          media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <!-- ========================================
         FIXED PAGE CONTROL
    ======================================== -->

    <div class="page-control">

        <!-- Question Mark -->

        <a href="#parent-company"
           class="info-button"
           id="info-button"
           aria-label="Enter">

            ?

        </a>


        <!-- X -->

        <a href="#hero"
           class="close-button"
           id="close-button"
           aria-label="Close">

            <span></span>
            <span></span>

        </a>

    </div>


    <!-- ========================================
         SCREEN 1
    ======================================== -->

    <section class="hero" id="hero">

        <div class="logo-container">

            <a href="#parent-company"
               aria-label="Enter ManyOrigin"
               id="enter-manyorigin">

                <img src="./assets/manyorigin-icon.svg"
                     alt="ManyOrigin">

            </a>

        </div>

    </section>


    <!-- ========================================
         SCREEN 2
    ======================================== -->

    <section class="parent-company" id="parent-company">

        <div class="parent-content">

            <h2>
                ManyOrigin is the<br>
                Parent Company<br>
                of
            </h2>


            <div class="child-company">

                <a href="https://wadisite.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/wadisite-logo.svg"
                         alt="WadiSite"
                         class="company-logo">

                </a>

            </div>


            <div class="child-company">

                <a href="https://factlark.com"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="./assets/factlark-logo.svg"
                         alt="FactLark"
                         class="company-logo">

                </a>

            </div>

        </div>

    </section>


<script>

    const manyOriginLogo =
        document.querySelector(".logo-container img");

    const infoButton =
        document.getElementById("info-button");

    const closeButton =
        document.getElementById("close-button");


    let pageTwoActive = false;

    let touchStartY = 0;
    let touchStartX = 0;
    let touchTriggered = false;


    // ========================================
    // ENTER PAGE 2
    // ========================================

    function enterPageTwo(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }


        // Already on Page 2

        if (pageTwoActive) return;


        pageTwoActive = true;


        // ? disappears immediately

        infoButton.classList.add("hide");


        // ManyOrigin logo disappears immediately

        manyOriginLogo.classList.add("hide");


        // X appears immediately

        closeButton.classList.add("show");


        // Move to Page 2

        window.scrollTo({
            top: window.innerHeight,
            behavior: "smooth"
        });

    }


    // ========================================
    // RETURN TO PAGE 1
    // ========================================

    function returnToPageOne(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }


        // Already on Page 1

        if (!pageTwoActive) return;


        pageTwoActive = false;


        // X disappears immediately

        closeButton.classList.remove("show");


        // ? appears immediately

        infoButton.classList.remove("hide");


        // ManyOrigin logo appears immediately

        manyOriginLogo.classList.remove("hide");


        // Move to Page 1

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // ========================================
    // MANYORIGIN LOGO
    // ========================================

    document
        .getElementById("enter-manyorigin")
        .addEventListener(
            "click",
            enterPageTwo
        );


    // ========================================
    // ? BUTTON
    // ALWAYS ACTIVE
    // ========================================

    infoButton.addEventListener(
        "click",
        enterPageTwo
    );


    // ========================================
    // X BUTTON
    // ALWAYS ACTIVE
    // ========================================

    closeButton.addEventListener(
        "click",
        returnToPageOne
    );


    // ========================================
    // DESKTOP — FULL PAGE SCROLL
    // ALWAYS ACTIVE
    // ========================================

    window.addEventListener(
        "wheel",
        function (event) {

            event.preventDefault();


            // Scroll DOWN → Page 2

            if (event.deltaY > 0) {

                if (!pageTwoActive) {

                    enterPageTwo();

                }

                return;
            }


            // Scroll UP → Page 1

            if (event.deltaY < 0) {

                if (pageTwoActive) {

                    returnToPageOne();

                }

                return;
            }

        },
        { passive: false }
    );


    // ========================================
    // MOBILE — TOUCH START
    // ALWAYS ACTIVE
    // ========================================

    window.addEventListener(
        "touchstart",
        function (event) {

            touchStartY =
                event.touches[0].clientY;

            touchStartX =
                event.touches[0].clientX;

            touchTriggered = false;

        },
        { passive: true }
    );


    // ========================================
    // MOBILE — TOUCH MOVE
    // ALWAYS ACTIVE
    // ========================================

    window.addEventListener(
        "touchmove",
        function (event) {

            event.preventDefault();


            if (touchTriggered) return;


            const currentY =
                event.touches[0].clientY;

            const currentX =
                event.touches[0].clientX;


            const deltaY =
                touchStartY - currentY;

            const deltaX =
                touchStartX - currentX;


            // Ignore horizontal gestures

            if (
                Math.abs(deltaX) >
                Math.abs(deltaY)
            ) {
                return;
            }


            // Very sensitive

            const swipeDistance = 25;


            // ====================================
            // SWIPE UP → PAGE 2
            // ====================================

            if (
                deltaY > swipeDistance &&
                !pageTwoActive
            ) {

                touchTriggered = true;

                enterPageTwo();

                return;
            }


            // ====================================
            // SWIPE DOWN → PAGE 1
            // ====================================

            if (
                deltaY < -swipeDistance &&
                pageTwoActive
            ) {

                touchTriggered = true;

                returnToPageOne();

                return;
            }

        },
        { passive: false }
    );


    // ========================================
    // MOBILE — TOUCH END
    // ========================================

    window.addEventListener(
        "touchend",
        function () {

            touchTriggered = false;

        },
        { passive: true }
    );


    // ========================================
    // KEEP EXACTLY AT PAGE POSITIONS
    // ========================================

    window.addEventListener(
        "scroll",
        function () {

            const pageHeight =
                window.innerHeight;


            // Page 1

            if (!pageTwoActive) {

                if (window.scrollY !== 0) {

                    window.scrollTo({
                        top: 0,
                        behavior: "auto"
                    });

                }

                return;
            }


            // Page 2

            if (window.scrollY !== pageHeight) {

                window.scrollTo({
                    top: pageHeight,
                    behavior: "auto"
                });

            }

        }
    );

</script>

</body>
</html>
